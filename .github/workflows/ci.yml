name: CI

on:
  push:
    branches: [main, master, euterpe/avalonia12-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_VERSION: "0.1.3"
  SMOKE_BASELINE_VERSION: "0.1.2"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Setup packaging Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: dotnet build Muses.slnx -c Release --artifacts-path "${{ runner.temp }}/muses-build"
      - name: Test
        env:
          MUSES_DATA_HOME: ${{ runner.temp }}/muses-suite-data
          MUSES_CACHE_HOME: ${{ runner.temp }}/muses-suite-cache
        run: dotnet test Muses.slnx -c Release --no-build --artifacts-path "${{ runner.temp }}/muses-build"
      - name: Build and check unsigned x64 MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Version $env:CANDIDATE_VERSION -OutputDir (Join-Path $env:RUNNER_TEMP 'muses-candidate')
      - name: Verify Windows release asset metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'muses-candidate'
          python scripts/prepare-release-assets.py $env:CANDIDATE_VERSION `
            --windows (Join-Path $candidate "Muses-$env:CANDIDATE_VERSION-win-x64.msix") `
            --allow-unsigned-msix --output $candidate
      - name: Build Ubuntu x64 packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          MUSES_MEDIA_BUILD_CACHE: ${{ runner.temp }}/muses-media-build
        run: |
          bash scripts/package-deb.sh "$SMOKE_BASELINE_VERSION" "$RUNNER_TEMP/muses-baseline"
          bash scripts/package-deb.sh "$CANDIDATE_VERSION" "$RUNNER_TEMP/muses-candidate"
      - name: Install, launch, upgrade legacy XDG data and remove the Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus xvfb xauth python3-xlib
          xvfb-run -a dbus-run-session -- bash scripts/test-deb.sh \
            "$RUNNER_TEMP/muses-candidate/Muses-$CANDIDATE_VERSION-linux-x64.deb"
          xvfb-run -a dbus-run-session -- bash scripts/test-deb.sh \
            "$RUNNER_TEMP/muses-candidate/Muses-$CANDIDATE_VERSION-linux-x64.deb" \
            "$RUNNER_TEMP/muses-baseline/Muses-$SMOKE_BASELINE_VERSION-linux-x64.deb"
      - name: Verify Linux release asset metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/prepare-release-assets.py "$CANDIDATE_VERSION" \
            --linux "$RUNNER_TEMP/muses-candidate/Muses-$CANDIDATE_VERSION-linux-x64.deb" \
            --output "$RUNNER_TEMP/muses-candidate"
      - name: Upload unsigned MSIX candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: muses-win-x64-unsigned-ci
          path: |
            ${{ runner.temp }}/muses-candidate/Muses-${{ env.CANDIDATE_VERSION }}-win-x64.msix
            ${{ runner.temp }}/muses-candidate/SHA256SUMS
            ${{ runner.temp }}/muses-candidate/release-asset-plan.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload Debian candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: muses-ubuntu-24.04-x64-ci
          path: |
            ${{ runner.temp }}/muses-candidate/Muses-${{ env.CANDIDATE_VERSION }}-linux-x64.deb
            ${{ runner.temp }}/muses-candidate/SHA256SUMS
            ${{ runner.temp }}/muses-candidate/release-asset-plan.json
          if-no-files-found: error
          compression-level: 0
