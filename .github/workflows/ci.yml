name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Muses.slnx
      - name: Build
        run: dotnet build Muses.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Muses.slnx -c Release --no-build --verbosity normal
